version: "3.9"

services:
  php:
    build: .
    container_name: ecommerce_php
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - CI_ENVIRONMENT=development
      - DB_HOST=db
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - DB_DATABASE=ecommerce_ci

  db:
    image: mysql:8.0
    container_name: ecommerce_mysql
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro
    ports:
      - "3307:3306"

  adminer:
    image: adminer
    container_name: ecommerce_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  db_data:
